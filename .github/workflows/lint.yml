name: Lint

# El lint del deploy corre en push a main, o sea ya mergeado: si una rama
# vieja reintroduce errores, el aviso llega cuando el deploy ya está en rojo.
# Este workflow lo adelanta al pull request.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Un push nuevo a la misma PR cancela la comprobación anterior.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
